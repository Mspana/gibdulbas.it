name: Fantasy board

# Only schedule and manual runs: a pull_request trigger would hand the ESPN
# cookies to any fork that opens one.
on:
  schedule:
    - cron: "7 * * * *"      # hourly, off the hour so we are not in the stampede
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fantasy-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Check out the builder
        uses: actions/checkout@v4
        with:
          repository: Mspana/BetterFantasyUI
          path: _tool

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # FantasyPros pages, per-player news and headshots all cache on disk.
      # Without this the job would re-scrape ~600 pages every hour and get
      # rate limited; with it, an hourly run only refreshes what has expired.
      - name: Restore scrape cache
        uses: actions/cache@v4
        with:
          path: |
            _tool/cache
            _tool/img
          key: fantasy-cache-${{ github.run_id }}
          restore-keys: |
            fantasy-cache-

      - name: Write league configs
        env:
          # Brunch and The Heights are read with one ESPN account, Poj with another.
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          POJ_ESPN_S2: ${{ secrets.POJ_ESPN_S2 }}
          POJ_ESPN_SWID: ${{ secrets.POJ_ESPN_SWID }}
        run: |
          python - <<'PY'
          import json, os
          # league, ESPN league id, our team id, whose cookies read it. The ids
          # are not secrets: Actions masks every occurrence of a secret's value
          # in the logs, and a team id of "7" would redact every 7 in the output.
          LEAGUES = [("brunch", 437516043, 7, ""),
                     ("heights", 1776817358, 10, ""),
                     ("poj", 248380, 5, "POJ_")]
          for name, league, team, account in LEAGUES:
              os.makedirs(f"_tool/leagues/{name}", exist_ok=True)
              json.dump({"league_id": league, "team_id": team, "season": 2026,
                         "espn_s2": os.environ[account + "ESPN_S2"],
                         "swid": os.environ[account + "ESPN_SWID"]},
                        open(f"_tool/leagues/{name}/config.json", "w"))
          PY

      # Each league's model.json comes from the builder repo: the model itself
      # runs weekly on a PC (weekly.py) and pushes it there.
      - name: Build the boards
        working-directory: _tool
        run: |
          # one league failing -- a FantasyPros rate limit, an expired cookie --
          # must not take the others down with it
          for league in brunch heights poj; do
            python run.py "$league" || echo "::warning::$league board failed this hour"
          done

      - name: Render the site
        working-directory: _tool
        run: |
          if [ -f leagues/brunch/report.html ]; then
            python build_site.py brunch "$GITHUB_WORKSPACE/fantasy"
          fi
          # the other two are unlisted: no link card, and kept out of search engines
          if [ -f leagues/heights/report.html ]; then
            python build_site.py heights "$GITHUB_WORKSPACE/hantasy" --hidden
          fi
          if [ -f leagues/poj/report.html ]; then
            python build_site.py poj "$GITHUB_WORKSPACE/pantasy" --hidden
          fi

      - name: Commit if anything changed
        run: |
          rm -rf _tool
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in fantasy hantasy pantasy; do
            if [ -d "$dir" ]; then git add "$dir"; fi
          done
          if git diff --cached --quiet; then
            echo "No change this hour."
            exit 0
          fi
          git commit -m "Fantasy board: refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Anything else pushing to main between checkout and now gets the
          # push rejected, so rebase onto it and try again rather than failing
          # the hour outright.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main || exit 1
          done
          echo "Could not push after three attempts" >&2
          exit 1
